name: Deploy to GitHub Pages

# Deploie le build SPA (build-pages.sh) sur la branche gh-pages.
# Le site Pages du repo est configure en mode legacy : source = branche gh-pages.
# Note : necessite un compte GitHub sans blocage de facturation.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build SPA (sous-dossier /416/)
        run: bash build-pages.sh

      - name: Deploy vers la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"
