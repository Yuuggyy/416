# Netlify configuration — 416 Records (TanStack Start + Nitro SSR)
#
# Nitro "netlify" preset génère automatiquement :
#   - .netlify/functions-internal/ pour la fonction SSR
#   - dist/ pour les assets statiques (JS, CSS, images)
#
# Node 22 requis : Supabase realtime-js utilise WebSocket natif
# (absent dans Node 20 → crash SSR à chaque requête)

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache long pour les assets immuables (hash dans le nom)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
