# Netlify configuration — 416 Records (SPA mode)
# Build: esbuild + Tailwind CSS → dist/

[build]
  command = "bash build-spa.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — toutes les routes vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache long pour les assets immuables
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
