<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="/416/manifest.webmanifest" />
  <link rel="icon" href="/416/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/416/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="416 Records" />
  <title>416 Records</title>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6614933308950023"
     crossorigin="anonymous"></script>
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    .app-loading-logo {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #a855f7;
      letter-spacing: -0.02em;
    }
    .app-loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(168, 85, 247, 0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="stylesheet" href="/416/app.css?v=1789462822" />
</head>
<body>
  <div id="app-loading">
    <div class="app-loading-logo">416 Records</div>
    <div class="app-loading-spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/416/app.js?v=1789462822"></script>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var el = document.getElementById('app-loading');
        if (el) {
          el.classList.add('hidden');
          setTimeout(function () { el.remove(); }, 400);
        }
      }, 300);
    });
  </script>
</body>
</html>
